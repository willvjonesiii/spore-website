<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Inter:wght@500&display=swap">
<style>
  html,body{margin:0;width:1200px;height:630px;overflow:hidden;background:#071221}
  .card{position:relative;width:1200px;height:630px;background:linear-gradient(160deg,#071221 0%,#0B1F36 55%,#071221 100%);display:flex;align-items:center;padding:0 90px;box-sizing:border-box;color:#F6F4EC;font-family:'Playfair Display',Georgia,serif}
  .thread{position:absolute;inset:0;opacity:.35}
  .orb{width:320px;height:320px;border-radius:50%;flex:none;background:radial-gradient(circle at 40% 36%,#8FEAEA 0%,#3ECFCF 40%,#0F5F63 100%);box-shadow:0 0 140px 50px rgba(62,207,207,.32);border:2px solid rgba(62,207,207,.8)}
  .text{margin-left:80px;display:flex;flex-direction:column;gap:18px}
  .eyebrow{font-family:Inter,system-ui,sans-serif;font-size:22px;letter-spacing:8px;color:#3ECFCF}
  .title{font-size:66px;line-height:1.05;font-weight:600}
  .line{font-family:Inter,system-ui,sans-serif;font-size:30px;color:#C3D4E0}
</style></head>
<body><div class="card">
<svg class="thread" viewBox="0 0 1200 630" preserveAspectRatio="none" fill="none" stroke="#3ECFCF" stroke-width="1.2">
  <path d="M-20 120 C 180 60, 320 220, 600 150 S 980 40, 1220 140"/>
  <path d="M-20 430 C 200 360, 380 520, 700 440 S 1000 340, 1220 430"/>
  <path d="M140 -20 C 100 120, 320 180, 220 320 S 60 520, 260 660"/>
  <path d="M960 -20 C 900 140, 1080 200, 1000 360 S 860 560, 1040 660"/>
</svg>
<div class="orb"></div>
<div class="text">
  <div class="eyebrow">SPORE</div>
  <div class="title">Something for you,<br>only in person.</div>
  <div class="line">Tap, say your name, and hold.</div>
</div>
</div></body></html>
