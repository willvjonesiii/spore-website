<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Email Signature — SPORE</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Space+Grotesk:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet" />

  <style>
    body {
      margin: 0;
      padding: 60px 40px;
      background: #f0ede8;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      font-family: 'Inter', Arial, sans-serif;
      min-height: 100vh;
    }
    .preview-note {
      font-family: Arial, sans-serif;
      font-size: 11px;
      color: #999;
      margin-bottom: 24px;
      max-width: 560px;
      line-height: 1.6;
    }

    @keyframes logo-wipe-loop {
      0%   { clip-path: inset(0 100% 0 0); opacity: 0; }
      2%   { opacity: 1; }
      20%  { clip-path: inset(0 0%   0 0); opacity: 1; }
      88%  { clip-path: inset(0 0%   0 0); opacity: 1; }
      96%  { opacity: 0; }
      100% { clip-path: inset(0 100% 0 0); opacity: 0; }
    }
    @keyframes brand-1-loop {
      0%   { opacity: 0; transform: translateY(5px); }
      17%  { opacity: 0; transform: translateY(5px); }
      26%  { opacity: 1; transform: translateY(0); }
      88%  { opacity: 1; transform: translateY(0); }
      96%  { opacity: 0; }
      100% { opacity: 0; transform: translateY(5px); }
    }
    @keyframes brand-2-loop {
      0%   { opacity: 0; transform: translateY(5px); }
      19%  { opacity: 0; transform: translateY(5px); }
      28%  { opacity: 1; transform: translateY(0); }
      88%  { opacity: 1; transform: translateY(0); }
      96%  { opacity: 0; }
      100% { opacity: 0; transform: translateY(5px); }
    }

    .logo-anim    { animation: logo-wipe-loop 8s cubic-bezier(0.25,0.46,0.45,0.94) infinite; }
    .brand-word-1 { animation: brand-1-loop 8s ease infinite; }
    .brand-word-2 { animation: brand-2-loop 8s ease infinite; }
    .sig-btn:hover { background: #5DDBDB !important; }
  </style>
</head>
<body>

  <p class="preview-note">
    <strong>Browser preview:</strong> Logo animation active here. Gmail renders statically — all content intact.
  </p>

  <div style="display:inline-block;border-radius:8px;overflow:hidden;box-shadow:0 8px 32px rgba(0,0,0,0.45),0 2px 8px rgba(0,0,0,0.25);">
  <table cellpadding="0" cellspacing="0" border="0"
    style="margin:0;border-collapse:collapse;font-family:'Inter',Arial,sans-serif;background:#081525;border:1px solid rgba(62,207,207,0.18);">
    <tbody>
      <tr>
        <td style="padding:15px 18px 15px 16px;border-collapse:collapse;vertical-align:top;border-radius:8px;">
          <table cellpadding="0" cellspacing="0" border="0" style="border-collapse:collapse;">
            <tbody>
              <tr>

                <!-- LEFT COLUMN -->
                <td valign="top" style="border-collapse:collapse;padding-right:20px;">
                  <table cellpadding="0" cellspacing="0" border="0" style="border-collapse:collapse;">
                    <tbody>

                      <!-- Logo + Brand Name -->
                      <tr>
                        <td style="padding-bottom:11px;white-space:nowrap;">
                          <table cellpadding="0" cellspacing="0" border="0" style="border-collapse:collapse;">
                            <tr>
                              <td valign="middle" style="padding-right:9px;">
                                <img src="https://www.joinspore.com/logo.png"
                                     class="logo-anim" width="32" height="32" alt="SPORE logo"
                                     style="display:block;">
                              </td>
                              <td valign="middle">
                                <div class="brand-word-1"
                                  style="font-family:'Space Grotesk',Arial,sans-serif;font-size:11px;font-weight:700;color:#3ECFCF;letter-spacing:0.28em;text-transform:uppercase;line-height:1.2;white-space:nowrap;">
                                  SPORE
                                </div>
                                <div class="brand-word-2"
                                  style="font-family:'Space Grotesk',Arial,sans-serif;font-size:6.5px;font-weight:400;color:rgba(62,207,207,0.5);letter-spacing:0.18em;text-transform:uppercase;margin-top:3px;white-space:nowrap;">
                                  Source Propagated Organic Reality Ecosystem
                                </div>
                              </td>
                            </tr>
                          </table>
                        </td>
                      </tr>

                      <!-- Teal Rule -->
                      <tr>
                        <td style="padding-bottom:10px;">
                          <table cellpadding="0" cellspacing="0" border="0" style="border-collapse:collapse;">
                            <tr>
                              <td width="130" height="1" style="background:#3ECFCF;font-size:0;line-height:0;">&nbsp;</td>
                              <td width="40"  height="1" style="background:rgba(62,207,207,0.08);font-size:0;line-height:0;">&nbsp;</td>
                            </tr>
                          </table>
                        </td>
                      </tr>

                      <!-- Name -->
                      <tr>
                        <td style="padding-bottom:2px;white-space:nowrap;">
                          <span style="font-family:'Playfair Display',Georgia,serif;font-size:19px;font-weight:600;font-style:italic;color:#ffffff;letter-spacing:0.01em;">
                            Will Jones
                          </span>
                        </td>
                      </tr>

                      <!-- Title -->
                      <tr>
                        <td style="padding-bottom:10px;white-space:nowrap;">
                          <span style="font-family:'Space Grotesk',Arial,sans-serif;font-size:7.5px;font-weight:400;color:#3ECFCF;letter-spacing:0.18em;text-transform:uppercase;">
                            Founder
                          </span>
                        </td>
                      </tr>

                      <!-- Phone -->
                      <tr>
                        <td style="padding-bottom:3px;white-space:nowrap;">
                          <a href="tel:8434732028"
                            style="text-decoration:none;font-family:'Inter',Arial,sans-serif;font-size:11px;font-weight:300;color:#8EA8C3;">
                            843-473-2028
                          </a>
                        </td>
                      </tr>

                      <!-- Website -->
                      <tr>
                        <td style="padding-bottom:13px;white-space:nowrap;">
                          <a href="https://www.joinspore.com"
                            style="text-decoration:none;font-family:'Inter',Arial,sans-serif;font-size:11px;font-weight:300;color:#3ECFCF;">
                            www.joinspore.com
                          </a>
                        </td>
                      </tr>

                      <!-- CTA Button -->
                      <tr>
                        <td>
                          <a href="https://meet.google.com/rni-vpzr-toi" target="_blank" class="sig-btn"
                            style="display:inline-block;background:#3ECFCF;color:#081525;font-family:'Space Grotesk',Arial,sans-serif;font-size:7.5px;font-weight:700;letter-spacing:0.16em;text-transform:uppercase;padding:6px 14px;text-decoration:none;white-space:nowrap;">
                            Book Meeting &nbsp;→
                          </a>
                        </td>
                      </tr>

                    </tbody>
                  </table>
                </td>

                <!-- Divider -->
                <td width="1" style="background:rgba(62,207,207,0.18);border-collapse:collapse;">&nbsp;</td>
                <td width="20" style="border-collapse:collapse;">&nbsp;</td>

                <!-- RIGHT COLUMN -->
                <td valign="top" style="border-collapse:collapse;">
                  <table cellpadding="0" cellspacing="0" border="0" style="border-collapse:collapse;">
                    <tbody>

                      <!-- Photo -->
                      <tr>
                        <td style="padding-bottom:9px;">
                          <img src="https://www.joinspore.com/will-square.jpg"
                               width="100" height="100" alt="Will Jones"
                               style="display:block;width:100px;height:100px;border-radius:50%;">
                        </td>
                      </tr>

                      <!-- Tagline -->
                      <tr>
                        <td style="width:110px;">
                          <div style="font-family:'Space Grotesk',Arial,sans-serif;font-size:6.5px;font-weight:400;color:rgba(62,207,207,0.5);letter-spacing:0.08em;text-transform:uppercase;line-height:1.85;text-align:center;width:110px;">
                            Where content unlocks<br>
                            Face to Face · In Person · Verified · On Chain
                          </div>
                        </td>
                      </tr>

                    </tbody>
                  </table>
                </td>

              </tr>
            </tbody>
          </table>
        </td>
      </tr>

      <!-- Teal bottom strip -->
      <tr>
        <td height="3" style="background:linear-gradient(90deg,#3ECFCF 0%,rgba(62,207,207,0.05) 100%);font-size:0;line-height:0;">&nbsp;</td>
      </tr>

    </tbody>
  </table>
  </div>

</body>
</html>
